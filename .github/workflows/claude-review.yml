# Reusable AI PR-review workflow. Callers invoke it from a `pull_request`
# workflow (see each repo's .github/workflows/claude.yml).
#
# Permission model: the review gets a full read shell (Read/Glob/Grep/LS plus
# Bash) so it never wastes turns on denied commands; scope and safety are
# enforced by separate mechanisms rather than a command allow-list:
#   - scope (don't run builds/tests): a narrow deny-list of package managers,
#     build/test runners, and network tools (in claude_args below)
#   - safety: a read-only contents token; denies on the git add/commit/rm/push
#     commands claude-code-action injects by default (deny beats allow from
#     every source); a harden-runner egress step (audit); the ephemeral runner
#
# ADOPTION PRECONDITION (cannot be enforced from here — callers must honor it):
# invoke this only on `pull_request`, never `pull_request_target`, and do not
# enable "send secrets to fork PRs". That trigger model is the real safety
# boundary — it keeps secret-bearing runs limited to same-repo (push-access)
# authors; fork and read-only-collaborator PRs get no secrets, so the review
# can't authenticate and never runs. The deny-list and egress control are
# defense-in-depth on top of it.
name: Claude Code – PR Review
on:
  workflow_call:
    inputs:
      model:
        description: "Claude model"
        required: false
        type: string
        default: "claude-sonnet-5"
      max_turns:
        description: "Maximum conversation turns"
        required: false
        type: number
        default: 15
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 15
      extra_prompt:
        description: "Additional prompt content appended after the base review prompt"
        required: false
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  # read-only: the review reads the checkout and posts comments, never pushes.
  # (The git add/commit/rm/push denies in claude_args below close the mutation
  # path claude-code-action's injected allows would otherwise leave open.)
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-review-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      # Network egress control, audit mode. MUST be the job's first step so
      # the monitor is installed before anything else runs. In audit mode
      # harden-runner logs every outbound connection (an egress audit trail —
      # how we see what the reviewer's runner actually contacts) and blocks
      # known-compromised C2/exfil endpoints from its built-in threat feed
      # regardless of policy. It does NOT block egress to a novel host in
      # audit mode. Staying in audit is deliberate: the real safety boundary
      # is the trigger model (see the adoption precondition at the top of this
      # file), and egress filtering — like the command deny-list, which can't
      # fence bash /dev/tcp or python sockets — is defense-in-depth. Switching
      # egress-policy to `block` with an `allowed-endpoints` list would stop
      # novel-host exfil rather than just log it, at the cost of maintaining
      # that list against endpoint drift; capture the baseline from a real
      # run's audit log first.
      - name: Harden runner egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Claude Code Review
        # Pinned below @v1 (latest) because 1.0.218 broke this workflow.
        # Revert to @v1 once a fixed release is out.
        uses: anthropics/claude-code-action@v1.0.217
        env:
          GITHUB_EVENT_NAME: pull_request
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "aikido-autofix-us,blacksmith-sh,dependabot,renovate"
          use_sticky_comment: true
          prompt: |
            /review

            ## Environment constraints

            This review is read-only. You have the Read, Glob, and Grep tools plus a
            shell for read-only inspection — git (log/diff/show), grep, find, sed, awk,
            jq, python3 one-liners, pipes, and loops all work. Batch repetitive
            per-file checks into a single command (e.g. one loop, or one
            process-substitution diff) instead of one command per file.

            Do NOT edit files, run builds, linters, or test suites, install
            dependencies, or access the network. Package managers, build tools, and
            network commands are blocked, and executing the project is out of scope
            regardless — the job is reading and reasoning about the diff. If something
            genuinely requires a blocked tool, note it once in the final comment
            instead of retrying. The checkout already contains full history and
            `origin/<base>` — do not `git fetch` or `git pull`.

            Because nothing here can be executed, most of what you report is
            inferred from reading rather than confirmed by running it. Disclose
            which is which. When a finding depends on something you could not
            confirm by reading — a runtime value, whether a test actually fails
            without the change, how a dependency behaves internally, whether a
            migration succeeds against real data — say that part is inferred and
            name what would confirm it. Do not present an inference as verified.

            Review primarily from the diff (`git diff origin/<base>...HEAD`), opening
            additional files only when a finding needs cross-file confirmation.

            The review rubric below already incorporates the organization-wide code
            review guidelines. Apply it IN ADDITION to any repository-specific
            CLAUDE.md guidelines.

            # Review rubric (Claude)

            ## Must-fix

            ### Security
            - OWASP Top 10 issues: SQL injection, XSS, CSRF, broken authentication, insecure deserialization
            - AuthN/Z: verify JWT validation, session management, proper OAuth flows, role-based access
            - API security: rate limiting, input validation, API key rotation, proper CORS configuration
            - Secrets: no hardcoded credentials, use environment variables or secrets management
            - PII handling: encrypt PII at rest and in transit, redact PII in logs and error messages
            - FedRAMP/HIPAA compliance requirements

            ### Compliance (HIPAA/SOC2/FedRAMP)
            - Logging: no PHI/PII in logs, logs encrypted, proper retention policies
            - Encryption: use approved algorithms (AES-256, TLS 1.2+), proper key management
            - Access control: least-privilege, MFA for admin access, proper role separation
            - Audit trails: log access to sensitive data, retain audit logs per compliance requirements
            - Data deletion: implement proper data lifecycle, support user data deletion requests

            ### Data & Migrations
            - Migrations: safe, rollbackable, tested in staging before production
            - Schema changes: backward compatible, no breaking changes without version bump
            - Indexes: add indexes for foreign keys and frequently queried columns
            - Data validation: constraints at database level, not just application level
            - PHI/PII: ensure proper encryption, audit trails for sensitive data access

            ### Mobile (iOS/Android)
            - UI thread safety: no network/database calls on main thread
            - Background work: proper WorkManager (Android) or BackgroundTask (iOS) usage
            - Permissions: clear rationale strings, runtime permission checks
            - Network: timeouts, retries with exponential backoff, offline handling
            - Security: certificate pinning, secure storage (Keychain/KeyStore), code obfuscation
            - Accessibility: VoiceOver/TalkBack support, proper content descriptions

            ### Infrastructure (Terraform/IaC/Docker)
            - IaC: Terraform state encryption, no hardcoded credentials, least-privilege IAM policies
            - Container security: non-root users, minimal base images, scan for vulnerabilities
            - Secrets: use AWS Secrets Manager/SSM Parameter Store, never commit secrets
            - Network: proper security groups, VPC configuration, no public exposure of sensitive resources
            - Monitoring: CloudWatch logs and alarms for critical resources

            ## Should-fix

            ### Performance
            - Database: N+1 queries, missing indexes, unbounded result sets
            - API: missing pagination for list endpoints, slow queries without caching
            - Memory: large allocations, memory leaks, inefficient data structures

            ### Testing
            - Unit tests: cover edge cases, error conditions, security validations
            - Integration tests: test API contracts, database interactions, mock external services
            - Security tests: authentication failures, authorization boundaries, input validation

            ### APIs/Services
            - API design: RESTful conventions, proper HTTP status codes, versioning strategy
            - Error handling: consistent error response format, proper logging without PII
            - Service-to-service: proper authentication tokens, circuit breakers, timeouts
            - Pagination: implement for list endpoints to prevent large responses
            - Documentation: ensure API changes include updated Swagger/OpenAPI docs

            ### Dependencies
            - Security: flag outdated dependencies with known CVEs
            - Version pinning: use specific versions in production dependencies
            - Licensing: ensure licenses are compatible with your usage
            - Deprecations: flag usage of deprecated APIs or libraries

            ## Nice-to-have (optional suggestions)

            - Code clarity: simplify complex logic, extract helper functions, add explanatory comments
            - Documentation: update README for significant features, add inline docs for complex logic
            - Performance optimizations: suggest caching opportunities, query optimizations (non-critical)

            ## Style

            - Follow the repo's linters and formatters
            - Keep suggestions concise and actionable
            - Show patch-style diffs for proposed changes
            - Group related issues together

            ## Behavior

            - Be terse and direct in comments
            - Prefer inline comments on specific diff lines when possible
            - Prioritize must-fix issues over nice-to-have suggestions
            - When reviewing code for issues, if you initially find an issue but then determine no fix is needed, do not comment on it in the findings summary.
            - Skip review for:
              - Pure whitespace/formatting changes (if linters pass)
              - Documentation-only updates (unless security/compliance docs)
              - Configuration changes without code impact
              - Minor dependency bumps (unless security-related)
            - If skipping, comment: "No significant code changes to review" and explain why

            ## Instructions
            1. Review the PR based on review rubric and focus on must-fix items, security, HIPAA, and compliance issues. Be concise.
            2. If issues found, post specific inline comments on the problematic lines
            3. If no issues, comment "LGTM - no security/compliance issues detected"
            4. Be concise and actionable
            5. Provide detailed feedback on code review

            ${{ inputs.extra_prompt }}
          # --allowedTools: bare `Bash` (plus the read tools) replaces the old
          # command enumeration — the model drives a full shell, so every
          # construct not on an allow-list (find, sed, awk, python3, pipes,
          # loops) used to cost a turn on a denial + retry. Safety does NOT rest
          # on this list; see the deny-list and the header.
          # --disallowedTools: scope guards + defense-in-depth (best-effort, not
          # a boundary — it can't fence bash /dev/tcp or python sockets). git
          # add/commit/rm/push: claude-code-action injects allows for exactly
          # these + its git-push.sh helper; deny beats allow, closing the push
          # path even for the action's own token. git fetch/pull: checkout is
          # complete already. Plus network tools and package/build/test runners
          # (executing the project is out of scope). Bash(...) patterns ONLY —
          # never an MCP tool name, or the sticky-comment tool breaks.
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools 'Read,Glob,Grep,LS,Bash'
            --disallowedTools 'Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(git rm:*),Bash(git fetch:*),Bash(git pull:*),Bash(gh:*),Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ncat:*),Bash(ssh:*),Bash(scp:*),Bash(rsync:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(pnpm:*),Bash(turbo:*),Bash(pip:*),Bash(pip3:*),Bash(poetry:*),Bash(uv:*),Bash(bundle:*),Bash(gem:*),Bash(pod:*),Bash(brew:*),Bash(apt:*),Bash(apt-get:*),Bash(sudo:*),Bash(make:*),Bash(cmake:*),Bash(gradle:*),Bash(./gradlew:*),Bash(xcodebuild:*),Bash(swift:*),Bash(pytest:*),Bash(tox:*),Bash(tsc:*),Bash(cargo:*),Bash(go:*),Bash(docker:*),Bash(terraform:*)'
          track_progress: true
